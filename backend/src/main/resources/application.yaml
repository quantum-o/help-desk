spring:
  application:
    name: modmail
  datasource:
    url: jdbc:postgresql://localhost:5432/modmail
    username: postgre
    password: toor
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      ddl-auto: update
  security:
    user:
      name: disabled
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
jwt:
  secret: very-very-very-very-very-very-secret-key
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
logging:
  level:
    root: "warn"
    org:
      springframework:
        web: "debug"
        security: "trace"
      hibernate: "error"